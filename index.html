<!DOCTYPE html>
<html lang="en-GB">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#1f4e78"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <title>Bonnie Farm</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6f9;
      color: #222;
    }

    header {
      background: #1f4e78;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 5px 0 0;
      font-size: 13px;
    }

    .status {
      padding: 10px;
      text-align: center;
      font-weight: bold;
      background: #eeeeee;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      color: #1f4e78;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input,
    select,
    textarea,
    button {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #bbb;
      font-size: 15px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button {
      margin-top: 15px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .sale-btn {
      background: #1f4e78;
      color: white;
    }

    .expense-btn {
      background: #555;
      color: white;
    }

    .sync-btn {
      background: #188038;
      color: white;
    }

    .danger-btn {
      background: #b3261e;
      color: white;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat {
      background: #f0f3f7;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 22px;
      margin-top: 5px;
    }

    .hidden {
      display: none;
    }

    .message {
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      background: #eef3f8;
    }

    @media (max-width: 500px) {

      .container {
        padding: 10px;
      }

      header h1 {
        font-size: 20px;
      }

    }

  </style>

</head>

<body>

<header>

  <h1>Bonnie Farm</h1>

  <p>Farm Management & Offline Point of Sale</p>

</header>

<div
  id="connectionStatus"
  class="status"
>
  Checking connection...
</div>

<div class="container">

  <div class="card">

    <div class="dashboard">

      <div class="stat">
        Sales Pending
        <strong id="salesPending">0</strong>
      </div>

      <div class="stat">
        Expenses Pending
        <strong id="expensesPending">0</strong>
      </div>

    </div>

    <button
      class="sync-btn"
      onclick="BF.syncAll()"
    >
      Synchronise Now
    </button>

  </div>


  <!-- DAILY SALES -->

  <div class="card">

    <h2>Daily Sales</h2>

    <form id="salesForm">

      <label>Day</label>

      <input
        id="saleDay"
        type="text"
        placeholder="e.g. Monday"
        required
      >

      <label>Date</label>

      <input
        id="saleDate"
        type="date"
        required
      >

      <label>Product</label>

      <select
        id="saleProduct"
        required
      >

        <option value="">Select product</option>

        <option>Eggs</option>
        <option>DO chicks</option>
        <option>OM chicks</option>
        <option>Manure</option>
        <option>Feeds</option>
        <option>Consultancy</option>
        <option>Training</option>
        <option>Mature Birds</option>

      </select>

      <label>Quantity</label>

      <input
        id="saleQuantity"
        type="number"
        min="0"
        step="any"
        required
      >

      <label>Amount (UGX)</label>

      <input
        id="saleAmount"
        type="number"
        min="0"
        step="1"
        required
      >

      <label>Customer</label>

      <input
        id="saleCustomer"
        type="text"
        required
      >

      <label>Sold by</label>

      <select
        id="saleSoldBy"
        required
      >

        <option value="">Select cashier</option>

        <option>Musa</option>
        <option>Bonnie</option>
        <option>Mum</option>
        <option>Prossy</option>
        <option>Tutu</option>

      </select>

      <label>Remarks</label>

      <textarea
        id="saleRemarks"
      ></textarea>

      <button
        type="submit"
        class="sale-btn"
      >
        Save Sale
      </button>

    </form>

  </div>


  <!-- DAILY EXPENSES -->

  <div class="card">

    <h2>Daily Expenses</h2>

    <form id="expenseForm">

      <label>Day</label>

      <input
        id="expenseDay"
        type="text"
        placeholder="e.g. Monday"
        required
      >

      <label>Date</label>

      <input
        id="expenseDate"
        type="date"
        required
      >

      <label>Description</label>

      <input
        id="expenseDescription"
        type="text"
        required
      >

      <label>Quantity</label>

      <input
        id="expenseQuantity"
        type="number"
        min="0"
        step="any"
        required
      >

      <label>Amount (UGX)</label>

      <input
        id="expenseAmount"
        type="number"
        min="0"
        step="1"
        required
      >

      <label>Supplier</label>

      <input
        id="expenseSupplier"
        type="text"
        required
      >

      <label>Paid by</label>

      <input
        id="expensePaidBy"
        type="text"
        required
      >

      <label>Category</label>

      <input
        id="expenseCategory"
        type="text"
        placeholder="e.g. Feed, Transport, Labour"
        required
      >

      <button
        type="submit"
        class="expense-btn"
      >
        Save Expense
      </button>

    </form>

  </div>


  <div class="card">

    <h2>System</h2>

    <div
      id="message"
      class="message"
    >
      Ready.
    </div>

    <button
      class="danger-btn"
      onclick="BF.clearCompleted()"
    >
      Clear Completed Local Records
    </button>

  </div>

</div>

<script src="app.js"></script>

</body>

</html>
